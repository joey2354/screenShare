<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mobile Cam Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background:#111;color:#fff;text-align:center;font-family:sans-serif;">
  <h2>👁️ Mobile Cam Viewer</h2>
  <video id="remoteVideo" autoplay playsinline style="width:90%;height:auto;border:2px solid #fff;"></video>


  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
  const socket = io('https://mobilecam-server.onrender.com'); // use your Render server URL
  const peer = new RTCPeerConnection({
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
  });

  const remoteVideo = document.getElementById('remoteVideo');

  // When a track is received from the mobile cam
  peer.ontrack = event => {
    remoteVideo.srcObject = event.streams[0];
  };

  // Listen for offer from the mobile cam
  socket.on('offer', async offer => {
    await peer.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await peer.createAnswer();
    await peer.setLocalDescription(answer);
    socket.emit('answer', peer.localDescription);
  });

  // ICE candidate exchange
  peer.onicecandidate = e => {
    if (e.candidate) socket.emit('ice-candidate', e.candidate);
  };
  socket.on('ice-candidate', async data => {
    try {
      await peer.addIceCandidate(new RTCIceCandidate(data));
    } catch (err) {
      console.error(err);
    }
  });
</script>

</body>
</html>
