<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mobile Cam Test</title>
</head>
<body style="background:#111;color:#fff;text-align:center;">
  <h2>📷 Mobile Cam Test</h2>
  <video id="localVideo" autoplay playsinline muted style="width:90%;border:2px solid #fff;"></video>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io('https://mobilecam-server.onrender.com'); // replace with your live URL
    const peer = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });

    const localVideo = document.getElementById('localVideo');

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true })
      .then(stream => {
        localVideo.srcObject = stream;
        stream.getTracks().forEach(track => peer.addTrack(track, stream));
        return peer.createOffer();
      })
      .then(offer => peer.setLocalDescription(offer))
      .then(() => socket.emit('offer', peer.localDescription));

    socket.on('answer', async data => {
      await peer.setRemoteDescription(new RTCSessionDescription(data));
    });

    peer.onicecandidate = e => {
      if (e.candidate) socket.emit('ice-candidate', e.candidate);
    };

    socket.on('ice-candidate', async data => {
      try {
        await peer.addIceCandidate(new RTCIceCandidate(data));
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
