<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mobile Cam Test – Tap to Start</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body style="background:#111;color:#fff;text-align:center;font-family:sans-serif;">
  <h2>📷 Mobile Cam Test</h2>
  <p>Tap the button below to start your camera</p>
  <button id="startCam" style="padding:15px 25px;font-size:18px;border:none;border-radius:5px;background:#28a745;color:#fff;cursor:pointer;">
    Start Camera
  </button>
  <br><br>
  <video id="localVideo" autoplay playsinline muted style="width:90%;height:auto;border:2px solid #fff;"></video>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io('https://mobilecam-server.onrender.com'); // replace with your Render URL
    const peer = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });

    const startButton = document.getElementById("startCam");
    const localVideo = document.getElementById("localVideo");

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      startButton.innerText = "Starting...";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: 640, height: 480 },
          audio: true
        });

        localVideo.srcObject = stream;

        stream.getTracks().forEach(track => peer.addTrack(track, stream));

        const offer = await peer.createOffer();
        await peer.setLocalDescription(offer);
        socket.emit('offer', peer.localDescription);

      } catch (err) {
        console.error("Error accessing camera:", err);
        alert("Camera access failed. Please check your permissions.");
        startButton.disabled = false;
        startButton.innerText = "Start Camera";
      }
    });

    socket.on('answer', async data => {
      await peer.setRemoteDescription(new RTCSessionDescription(data));
    });

    peer.onicecandidate = e => {
      if (e.candidate) socket.emit('ice-candidate', e.candidate);
    };

    socket.on('ice-candidate', async data => {
      try {
        await peer.addIceCandidate(new RTCIceCandidate(data));
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
